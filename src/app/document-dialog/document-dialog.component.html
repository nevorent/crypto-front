<div class="flex items-center justify-between p-4 border-b border-gray-200">
  <h2 mat-dialog-title class="!m-0 text-xl font-bold text-gray-800">
    Document Details
  </h2>
  
  <button mat-icon-button mat-dialog-close aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="!p-6 min-w-[400px]">
  <div class="space-y-4">

    <div class="flex justify-between items-center">
      <span class="text-gray-500 font-medium">Filename:</span>
      <div class="flex items-center gap-2">
        <mat-icon class="text-red-500 text-sm h-5 w-5">description</mat-icon>
        <span class="font-semibold text-gray-900">{{ data.filename }}</span>
      </div>
    </div>

    <div class="flex justify-between items-center">
      <span class="text-gray-500 font-medium">Status:</span>
      <span class="px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide"
            [ngClass]="{
              'bg-green-100 text-green-700': data.status === 'Signed',
              'bg-yellow-100 text-yellow-700': data.status === 'Pending',
              'bg-gray-100 text-gray-700': data.status === 'Draft'
            }">
        {{ data.status }}
      </span>
    </div>

  </div>
</mat-dialog-content>

<mat-divider></mat-divider>

<mat-dialog-actions align="center" class="!p-4 gap-2">
  <button mat-stroked-button color="warn" (click)="deleteDocument()">
    <mat-icon>delete</mat-icon>
    Delete
  </button>

  <button mat-flat-button color="primary" (click)="signDocument()">
    <mat-icon>edit_document</mat-icon>
    Sign Document
  </button>
</mat-dialog-actions>
