<div class="p-4 bg-white border-t border-gray-200 w-full">
    
  <div class="flex items-center gap-2">
    
    <button (click)="attachFile()" 
            class="text-gray-500 hover:text-gray-700 p-2 rounded-full hover:bg-gray-100 transition flex-shrink-0"
            title="Attach File">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13" />
      </svg>
    </button>

    <input type="text" 
           [(ngModel)]="messageText"
           (keyup.enter)="sendMessage()"
           placeholder="Type a message..." 
           class="flex-1 border border-gray-300 rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />

    <button (click)="sendMessage()" 
            [disabled]="!messageText.trim()"
            [class.opacity-50]="!messageText.trim()"
            class="bg-red-600 hover:bg-red-700 text-white rounded-full p-2 px-4 shadow-md transition flex items-center gap-2 flex-shrink-0 disabled:cursor-not-allowed">
      <span class="font-medium text-sm">Send</span>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
      </svg>
    </button>

  </div>
</div>
