<mat-card class="justify-center-safe m-20 py-40">
    <mat-card-header class="justify-center">
        <h1>Log-in</h1>
    </mat-card-header>
    <mat-card-content>
        <div class="flex flex-col">
        <mat-form-field class="mx-10">
            <mat-label> E-mail </mat-label>
            <input matInput type="email">
        </mat-form-field>
        <mat-form-field class="mx-10">
            <mat-label> Password </mat-label>
            <input matInput type="password">
        </mat-form-field>
        </div>
    </mat-card-content>
    <mat-card-actions class="flex justify-center">
        <button mat-flat-button> Log In </button>
    </mat-card-actions>
</mat-card>
