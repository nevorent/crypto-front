<mat-card class="justify-center-safe mx-20 my-5 py-40">
    <mat-card-header class="justify-center">
        <h1>Log-in</h1>
    </mat-card-header>
    <mat-card-content>
        <div class="flex flex-col">
        <mat-form-field class="mx-10">
            <mat-label> E-mail </mat-label>
            <input matInput type="email" [(ngModel)]="loginUser.username">
        </mat-form-field>
        <mat-form-field class="mx-10">
            <mat-label> Password </mat-label>
            <input matInput type="password" [(ngModel)]="loginUser.password">
        </mat-form-field>
        </div>
    </mat-card-content>
    <mat-card-actions class="flex justify-center">
        <button mat-flat-button (click)="login()"> Log In </button>
    </mat-card-actions>
    <p class="flex justify-center"> Don't have an account? <a href="/register"> Create an account.</a></p>
</mat-card>
