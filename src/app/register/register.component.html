<mat-card class="justify-center-safe m-20 py-40">
    <mat-card-header class="justify-center">
        <h1>Register</h1>
    </mat-card-header>
    <mat-card-content>
        <div class="flex flex-col">
        <mat-form-field class="mx-10">
            <mat-label> E-mail </mat-label>
            <input matInput type="email" [(ngModel)]="registerUser.email">
        </mat-form-field>
        <mat-form-field class="mx-10">
            <mat-label> Username </mat-label>
            <input matInput type="text" [(ngModel)]="registerUser.username">
        </mat-form-field>
        <mat-form-field class="mx-10">
            <mat-label> Password </mat-label>
            <input matInput type="password" [(ngModel)]="registerUser.password">
        </mat-form-field>
        </div>
    </mat-card-content>
    <mat-card-actions class="flex justify-center">
        <button mat-flat-button (click)="register()"> Register </button>
    </mat-card-actions>
</mat-card>
