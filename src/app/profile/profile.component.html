<div class="profile-container mx-40 my-20">

  <mat-card class="profile-card">
    <div class="profile-header-bg"></div> <mat-card-header class="profile-header">
      <div mat-card-avatar class="avatar-placeholder">
        <mat-icon>person</mat-icon>
      </div>
      <mat-card-title>{{ username }}</mat-card-title>
      <mat-card-subtitle>{{ email }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="profile-details">
      
      <div class="detail-row">
        <span class="label">Status:</span>
        <mat-chip-set>
          <mat-chip [color]="isActive ? 'primary' : 'warn'" selected>
            {{ isActive ? 'Active' : 'Inactive' }}
          </mat-chip>
        </mat-chip-set>
      </div>

      <div class="detail-row">
        <span class="label">Member Since:</span>
        <span class="value">{{ createdAt | date:'mediumDate' }}</span>
      </div>

    </mat-card-content>

    <mat-divider></mat-divider>

    <mat-card-actions class="flex justify-evenly">
      <button mat-button color="warn" (click)="null">Deactivate Account</button>
      <button mat-flat-button color="primary" (click)="null">Edit Info</button>
      <button mat-button color="warn" (click)="openIdentityDialog()">Identity</button>
    </mat-card-actions>
  </mat-card>


  <mat-card class="docs-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon class="align-icon">folder_shared</mat-icon> 
        My Documents
      </mat-card-title>
    </mat-card-header>

    <mat-card-content>
    
    <div class="py-4"> 
      <ng-carousel 
        [config]="carouselConfig"
        #carouselRef="ngCarousel"
      >
        <ng-template [ngCarouselSlide]="carouselRef" let-doc>
          
          <div class="slide-item min-w-[150px] p-4 border border-gray-200 rounded-lg cursor-pointer hover:bg-gray-50 transition text-center mx-2"
               (click)="openDocumentDetails(doc)">
            
            <div class="doc-preview bg-red-50 text-red-500 w-12 h-12 mx-auto rounded-full flex items-center justify-center mb-2">
               <mat-icon>description</mat-icon>
            </div>
            
            <p class="truncate w-full text-sm font-medium" [matTooltip]="doc.filename">
              {{doc.filename}}
            </p>
          </div>
        </ng-template>
      </ng-carousel>

      <div *ngIf="documents.length === 0" class="text-center text-gray-400 py-8">
        No documents found.
      </div>

    </div>

  </mat-card-content>
    <mat-card-actions class="flex justify-evenly mt-4">
      <button mat-flat-button color="primary" (click)="triggerFileSelect()">Upload Document</button>
      <input type="file" 
        #fileInput 
        hidden 
        (change)="onFileSelected($event)">
    </mat-card-actions>
  </mat-card>

</div>
