<div class="grid grid-cols-[1fr_4fr] h-[91vh]">
    <app-users-filter
        (userSelected)="changeReceiver($event)"
    ></app-users-filter>
    <div class="flex flex-col bg-gray-50">
        <div class="flex-1 overflow-y-auto p-4">
            <app-chat
                [sender]="sender"
                [receiver]="receiver"
                [messages]="messages"
            ></app-chat>
        </div>

        <app-message-box (messageSent)="null"></app-message-box>
    </div>
</div>
