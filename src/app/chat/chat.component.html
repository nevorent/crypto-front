<div #scrollContainer class="h-[80vh] overflow-y-auto p-4 flex flex-col space-y-4">
    <div *ngFor="let msg of messages" 
        class="flex w-full" 
        [ngClass]="{'justify-end': isCurrentUser(msg), 'justify-start': !isCurrentUser(msg)}">

        <div class="max-w-[75%] rounded-2xl p-3 shadow-sm relative group"
            [ngClass]="{
            'bg-red-600 text-white rounded-br-none': isCurrentUser(msg), 
            'bg-white border border-gray-200 text-gray-800 rounded-bl-none': !isCurrentUser(msg)
            }">

            <div class="flex items-center gap-3 p-2 rounded-lg mb-2"
                [ngClass]="{
                'bg-red-700/50': isCurrentUser(msg), 
                'bg-gray-100': !isCurrentUser(msg)
                }">

                <div class="p-2 rounded bg-white/20 text-current">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
                    </svg>
                </div>

                <div class="flex flex-col overflow-hidden">
                    <span class="text-sm font-semibold truncate">
                        {{ msg.document.filename }}
                    </span>
                    <span class="text-xs opacity-80 uppercase">PDF Document</span>
                </div>
            </div>

            <div *ngIf="msg.content" class="px-1 mb-1 text-sm leading-relaxed whitespace-pre-wrap">
                {{ msg.content }}
            </div>

            <div class="text-[10px] text-right opacity-70 mt-1 select-none">
                {{ msg.sentAt | date:'shortTime' }}
            </div>

        </div>
        <div *ngIf="!isCurrentUser(msg)" class="ml-8 content-center">
            <button mat-mini-fab 
                matTooltip="Verify Document"
                (click)="verifySignature(msg.document.id, msg.senderId)"
                class="bg-green-600 hover:bg-green-700 text-white shadow-md !bg-green-600">
                <mat-icon>check</mat-icon>
            </button>
            </div>
    </div>
</div>
