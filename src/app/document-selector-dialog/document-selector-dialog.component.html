<div class="flex items-center justify-between p-4 border-b border-gray-200">
  <h2 mat-dialog-title class="!m-0 text-xl font-bold text-gray-800 flex items-center gap-2">
    <mat-icon class="text-blue-600">library_books</mat-icon>
    Select a Document
  </h2>
  
  <button mat-icon-button (click)="close()" aria-label="Close dialog">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="!p-0 min-w-[400px] max-h-[400px] overflow-y-auto">
  
  <mat-nav-list *ngIf="documents.length > 0; else noDocs">
    <a mat-list-item 
       *ngFor="let doc of documents" 
       (click)="selectDocument(doc)"
       class="!h-auto py-2 hover:bg-gray-50 transition cursor-pointer">
      
      <div matListItemIcon>
        <mat-icon class="text-red-500 bg-red-50 p-1 rounded-full w-8 h-8 flex items-center justify-center">
          description
        </mat-icon>
      </div>

      <div matListItemTitle class="font-semibold text-gray-800">
        {{ doc.filename }}
      </div>
      
      <div matListItemLine class="text-sm text-gray-500 flex items-center gap-2 mt-1">
        <span>ID: #{{ doc.id }}</span>
        <span class="w-1 h-1 rounded-full bg-gray-300"></span>
        <span [ngClass]="{
          'text-green-600': doc.status === 'Signed',
          'text-yellow-600': doc.status === 'Pending',
          'text-gray-500': doc.status === 'Draft'
        }" class="uppercase text-[10px] font-bold tracking-wider">
          {{ doc.status }}
        </span>
      </div>

      <div matListItemMeta>
        <mat-icon class="text-gray-400">chevron_right</mat-icon>
      </div>
    </a>
    <mat-divider></mat-divider>
  </mat-nav-list>

  <ng-template #noDocs>
    <div class="flex flex-col items-center justify-center py-12 text-gray-400">
      <mat-icon class="text-5xl mb-2 opacity-20">folder_off</mat-icon>
      <p>No documents found.</p>
    </div>
  </ng-template>

</mat-dialog-content>
